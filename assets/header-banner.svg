<svg width="920" height="300" viewBox="0 0 920 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glowG" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur">
        <animate attributeName="stdDeviation" values="3;7;3" dur="2.4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="920" height="300" fill="#000000"/>

  <!-- faint grid -->
  <g stroke="#00ff41" stroke-width="1" opacity="0.05">
    <line x1="40" y1="0" x2="40" y2="300"/><line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="300"/><line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/><line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="280" y1="0" x2="280" y2="300"/><line x1="320" y1="0" x2="320" y2="300"/>
    <line x1="360" y1="0" x2="360" y2="300"/><line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="440" y1="0" x2="440" y2="300"/><line x1="480" y1="0" x2="480" y2="300"/>
    <line x1="520" y1="0" x2="520" y2="300"/><line x1="560" y1="0" x2="560" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/><line x1="640" y1="0" x2="640" y2="300"/>
    <line x1="680" y1="0" x2="680" y2="300"/><line x1="720" y1="0" x2="720" y2="300"/>
    <line x1="760" y1="0" x2="760" y2="300"/><line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="840" y1="0" x2="840" y2="300"/><line x1="880" y1="0" x2="880" y2="300"/>
    <line x1="0" y1="40" x2="920" y2="40"/><line x1="0" y1="80" x2="920" y2="80"/>
    <line x1="0" y1="120" x2="920" y2="120"/><line x1="0" y1="160" x2="920" y2="160"/>
    <line x1="0" y1="200" x2="920" y2="200"/><line x1="0" y1="240" x2="920" y2="240"/>
    <line x1="0" y1="260" x2="920" y2="260"/>
  </g>

  <!-- binary rain, flickering columns -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="11" fill="#00ff41">
    <g opacity="0.18">
      <animate attributeName="opacity" values="0.06;0.22;0.06" dur="1.8s" repeatCount="indefinite"/>
      <text x="28" y="30">1</text><text x="28" y="50">0</text><text x="28" y="70">1</text><text x="28" y="90">1</text><text x="28" y="110">0</text><text x="28" y="130">0</text><text x="28" y="150">1</text><text x="28" y="170">0</text><text x="28" y="190">1</text><text x="28" y="210">1</text><text x="28" y="230">0</text><text x="28" y="250">1</text><text x="28" y="270">0</text>
    </g>
    <g opacity="0.14">
      <animate attributeName="opacity" values="0.20;0.05;0.20" dur="2.3s" begin="0.4s" repeatCount="indefinite"/>
      <text x="70" y="20">0</text><text x="70" y="40">1</text><text x="70" y="60">0</text><text x="70" y="80">0</text><text x="70" y="100">1</text><text x="70" y="120">1</text><text x="70" y="140">0</text><text x="70" y="160">1</text><text x="70" y="180">0</text><text x="70" y="200">0</text><text x="70" y="220">1</text><text x="70" y="240">1</text><text x="70" y="280">0</text>
    </g>
    <g opacity="0.18">
      <animate attributeName="opacity" values="0.06;0.22;0.06" dur="2.0s" begin="0.8s" repeatCount="indefinite"/>
      <text x="862" y="24">1</text><text x="862" y="44">1</text><text x="862" y="64">0</text><text x="862" y="84">1</text><text x="862" y="104">0</text><text x="862" y="124">0</text><text x="862" y="144">1</text><text x="862" y="164">1</text><text x="862" y="184">0</text><text x="862" y="204">1</text><text x="862" y="224">0</text><text x="862" y="244">1</text><text x="862" y="264">0</text>
    </g>
    <g opacity="0.14">
      <animate attributeName="opacity" values="0.20;0.05;0.20" dur="1.6s" begin="1.1s" repeatCount="indefinite"/>
      <text x="896" y="34">0</text><text x="896" y="54">1</text><text x="896" y="74">1</text><text x="896" y="94">0</text><text x="896" y="114">1</text><text x="896" y="134">0</text><text x="896" y="154">1</text><text x="896" y="174">1</text><text x="896" y="194">0</text><text x="896" y="214">0</text><text x="896" y="234">1</text><text x="896" y="254">1</text>
    </g>
  </g>

  <!-- scanline sweep -->
  <rect x="6" y="6" width="908" height="3" fill="#00ff41" opacity="0.25">
    <animate attributeName="y" values="6;294;6" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD corner brackets -->
  <g stroke="#00ff41" stroke-width="2" fill="none">
    <polyline points="16,44 16,16 44,16">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </polyline>
    <polyline points="876,16 904,16 904,44">
      <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </polyline>
    <polyline points="16,256 16,284 44,284">
      <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </polyline>
    <polyline points="876,284 904,284 904,256">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </polyline>
  </g>

  <!-- top terminal line + blinking cursor -->
  <text x="30" y="40" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" fill="#00ff41">root@chanindu:~$ ./init_profile.sh<tspan fill="#00ff41">▌<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/></tspan></text>

  <!-- top-right readout -->
  <text x="890" y="40" text-anchor="end" font-family="'JetBrains Mono','Courier New',monospace" font-size="11" fill="#00ff41" opacity="0.75">ENCRYPTION: AES-256</text>

  <!-- glitch name effect -->
  <g>
    <text x="463" y="155" text-anchor="middle" font-family="'Courier New',monospace" font-size="48" font-weight="800" fill="#ff2b6d" opacity="0.55">
      CHANINDU IMANJITH
      <animateTransform attributeName="transform" type="translate" values="0,0;0,0;-4,1;3,-1;0,0;0,0" keyTimes="0;0.9;0.92;0.94;0.96;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="457" y="153" text-anchor="middle" font-family="'Courier New',monospace" font-size="48" font-weight="800" fill="#00e5ff" opacity="0.5">
      CHANINDU IMANJITH
      <animateTransform attributeName="transform" type="translate" values="0,0;0,0;4,-1;-3,1;0,0;0,0" keyTimes="0;0.9;0.92;0.94;0.96;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="460" y="154" text-anchor="middle" font-family="'Courier New',monospace" font-size="48" font-weight="800" fill="#00ff41" filter="url(#glowG)">CHANINDU IMANJITH</text>
  </g>

  <!-- subtitle -->
  <text x="460" y="188" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="14" letter-spacing="4" fill="#00ff41" opacity="0.9">SOFTWARE ENGINEERING UNDERGRADUATE</text>

  <!-- bracket tags -->
  <text x="460" y="220" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" fill="#00ff41">[ DEVOPS ] [ CLOUD ] [ MLOPS ] [ OPEN_SOURCE ]</text>

  <!-- bottom status bar -->
  <rect x="16" y="256" width="888" height="1" fill="#00ff41" opacity="0.25"/>
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="11.5" fill="#00ff41" opacity="0.85">
    <circle cx="34" cy="272" r="3" fill="#00ff41">
      <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="276">STATUS: ONLINE</text>
    <text x="330" y="276" text-anchor="middle">UPTIME: 100%</text>
    <text x="620" y="276" text-anchor="middle">ROLE: SWE_UNDERGRAD</text>
    <text x="890" y="276" text-anchor="end">ACCESS: ROOT</text>
  </g>
</svg>