<svg width="100%" height="28" viewBox="0 0 900 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Line Glow Filter -->
    <filter id="divGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="lineGradLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="60%" stop-color="#00ff41" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="lineGradRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#00ff41" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>

    <!-- Scanning Laser Gradient -->
    <linearGradient id="laserGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff41" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Base Line -->
  <line x1="30" y1="14" x2="390" y2="14" stroke="url(#lineGradLeft)" stroke-width="1.5"/>
  <line x1="510" y1="14" x2="870" y2="14" stroke="url(#lineGradRight)" stroke-width="1.5"/>

  <!-- Glowing Core Line with Glow Filter -->
  <line x1="120" y1="14" x2="390" y2="14" stroke="#00ff41" stroke-width="1" opacity="0.6" filter="url(#divGlow)"/>
  <line x1="510" y1="14" x2="780" y2="14" stroke="#00ff41" stroke-width="1" opacity="0.6" filter="url(#divGlow)"/>

  <!-- Scanning Laser Packet (Left Side) -->
  <rect y="13" width="80" height="2" fill="url(#laserGrad)" filter="url(#divGlow)">
    <animate attributeName="x" values="30;310;30" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Scanning Laser Packet (Right Side) -->
  <rect y="13" width="80" height="2" fill="url(#laserGrad)" filter="url(#divGlow)">
    <animate attributeName="x" values="790;510;790" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Left Tech Accents -->
  <circle cx="25" cy="14" r="2.5" fill="#00ff41">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <line x1="8" y1="10" x2="8" y2="18" stroke="#00ff41" stroke-width="1.5" opacity="0.7"/>
  <line x1="12" y1="12" x2="12" y2="16" stroke="#00ff41" stroke-width="1" opacity="0.5"/>

  <!-- Right Tech Accents -->
  <circle cx="875" cy="14" r="2.5" fill="#00ff41">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.75s" repeatCount="indefinite"/>
  </circle>
  <line x1="892" y1="10" x2="892" y2="18" stroke="#00ff41" stroke-width="1.5" opacity="0.7"/>
  <line x1="888" y1="12" x2="888" y2="16" stroke="#00ff41" stroke-width="1" opacity="0.5"/>

  <!-- Center Cyber Badge / HUD Box -->
  <g transform="translate(450, 14)">
    <!-- Center Diamond -->
    <rect x="-6" y="-6" width="12" height="12" fill="#000000" stroke="#00ff41" stroke-width="1.5" transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate" values="45;225;45" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="0" cy="0" r="2" fill="#00ff41">
      <animate attributeName="r" values="1.5;3;1.5" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Outer Brackets -->
    <path d="M -45 -9 L -52 -9 L -52 9 L -45 9" stroke="#00ff41" stroke-width="1.2" fill="none" opacity="0.8"/>
    <path d="M 45 -9 L 52 -9 L 52 9 L 45 9" stroke="#00ff41" stroke-width="1.2" fill="none" opacity="0.8"/>

    <!-- Micro Tech Text -->
    <text x="-16" y="3.5" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="8" fill="#00ff41" letter-spacing="1" text-anchor="end" opacity="0.85">0x7F</text>
    <text x="16" y="3.5" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="8" fill="#00ff41" letter-spacing="1" text-anchor="start" opacity="0.85">SYS</text>
  </g>
</svg>
