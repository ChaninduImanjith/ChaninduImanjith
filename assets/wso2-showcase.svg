<svg width="100%" height="180" viewBox="0 0 900 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card Glow Filter -->
    <filter id="wso2Glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scan Line Gradient -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff41" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>

    <!-- Number Glow -->
    <filter id="numGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="2" y="2" width="896" height="176" rx="6" fill="#000000" stroke="#00ff41" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Subtle Inner Grid Lines -->
  <g stroke="#00ff41" stroke-width="0.8" opacity="0.05">
    <line x1="0" y1="36" x2="900" y2="36"/>
    <line x1="0" y1="72" x2="900" y2="72"/>
    <line x1="0" y1="108" x2="900" y2="108"/>
    <line x1="0" y1="144" x2="900" y2="144"/>
    <line x1="280" y1="36" x2="280" y2="176"/>
    <line x1="600" y1="36" x2="600" y2="176"/>
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 8 16 L 8 8 L 16 8" stroke="#00ff41" stroke-width="2" fill="none"/>
  <path d="M 892 16 L 892 8 L 884 8" stroke="#00ff41" stroke-width="2" fill="none"/>
  <path d="M 8 164 L 8 172 L 16 172" stroke="#00ff41" stroke-width="2" fill="none"/>
  <path d="M 892 164 L 892 172 L 884 172" stroke="#00ff41" stroke-width="2" fill="none"/>

  <!-- Scanning Sweep Laser -->
  <rect x="2" y="36" width="80" height="1" fill="url(#scanGrad)" filter="url(#wso2Glow)">
    <animate attributeName="x" values="2;816;2" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Top Title Bar -->
  <rect x="2" y="2" width="896" height="34" fill="#0d1117" rx="6" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.3"/>
  <circle cx="22" cy="18" r="4" fill="#ff5f56"/>
  <circle cx="36" cy="18" r="4" fill="#ffbd2e"/>
  <circle cx="50" cy="18" r="4" fill="#27c93f"/>

  <!-- Title Text -->
  <g font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" fill="#00ff41">
    <text x="72" y="22" font-weight="700">WSO2 ENTERPRISE OPEN-SOURCE CONTRIBUTIONS // UPSTREAM VERIFIED</text>
    <text x="880" y="22" text-anchor="end" font-size="11" opacity="0.8">ECOSYSTEM: WSO2 &amp; CHOREO</text>
  </g>

  <!-- Left Highlight Box: 16 Merged PRs Metric -->
  <g transform="translate(30, 48)">
    <rect x="0" y="0" width="220" height="114" rx="4" fill="#000000" stroke="#00ff41" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="110" y="62" text-anchor="middle" font-family="'Courier New', monospace" font-size="54" font-weight="900" fill="#00ff41" filter="url(#numGlow)">
      16
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
    </text>
    <text x="110" y="86" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00ff41" letter-spacing="1">MERGED PULL REQUESTS</text>
    <text x="110" y="102" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7ee787" opacity="0.8">100% PRODUCTION ACCEPTED</text>
  </g>

  <!-- Center Breakdown: Target Repositories -->
  <g transform="translate(275, 48)" font-family="'JetBrains Mono', monospace">
    <text x="0" y="20" font-size="11" font-weight="700" fill="#00ff41">REPOSITORIES &amp; PLATFORMS</text>

    <!-- Repo 1 -->
    <g transform="translate(0, 32)">
      <circle cx="4" cy="5" r="3" fill="#00ff41"/>
      <text x="14" y="9" font-size="11" fill="#c9d1d9"><tspan font-weight="700" fill="#00ff41">wso2/docs-mi</tspan> — 14 Merged PRs</text>
      <text x="14" y="23" font-size="9.5" fill="#7ee787" opacity="0.85">Enterprise Integrator · K8s · Active-Active</text>
    </g>

    <!-- Repo 2 -->
    <g transform="translate(0, 68)">
      <circle cx="4" cy="5" r="3" fill="#00ff41"/>
      <text x="14" y="9" font-size="11" fill="#c9d1d9"><tspan font-weight="700" fill="#00ff41">wso2/docs-is</tspan> — 1 Merged PR</text>
      <text x="14" y="23" font-size="9.5" fill="#7ee787" opacity="0.85">Identity Server Architecture</text>
    </g>

    <!-- Repo 3 -->
    <g transform="translate(0, 98)">
      <circle cx="4" cy="5" r="3" fill="#00ff41"/>
      <text x="14" y="9" font-size="11" fill="#c9d1d9"><tspan font-weight="700" fill="#00ff41">openchoreo/backstage</tspan> — 1 Merged PR</text>
    </g>
  </g>

  <!-- Right Breakdown: Technical Domains -->
  <g transform="translate(585, 48)" font-family="'JetBrains Mono', monospace">
    <text x="0" y="20" font-size="11" font-weight="700" fill="#00ff41">TECHNICAL DOMAINS &amp; IMPACT</text>

    <g font-size="9.5" fill="#00ff41">
      <rect x="0" y="32" width="135" height="22" rx="3" fill="#0d1117" stroke="#00ff41" stroke-width="0.8"/>
      <text x="67" y="46" text-anchor="middle">☸️ Kubernetes Shared</text>

      <rect x="145" y="32" width="135" height="22" rx="3" fill="#0d1117" stroke="#00ff41" stroke-width="0.8"/>
      <text x="212" y="46" text-anchor="middle">☁️ AWS SQS &amp; S3 Path</text>

      <rect x="0" y="62" width="135" height="22" rx="3" fill="#0d1117" stroke="#00ff41" stroke-width="0.8"/>
      <text x="67" y="76" text-anchor="middle">⚡ RabbitMQ URL Tuning</text>

      <rect x="145" y="62" width="135" height="22" rx="3" fill="#0d1117" stroke="#00ff41" stroke-width="0.8"/>
      <text x="212" y="76" text-anchor="middle">🗄️ JDBC Tuning (5 Vers)</text>

      <rect x="0" y="92" width="135" height="22" rx="3" fill="#0d1117" stroke="#00ff41" stroke-width="0.8"/>
      <text x="67" y="106" text-anchor="middle">🔐 Identity Server Core</text>

      <rect x="145" y="92" width="135" height="22" rx="3" fill="#0d1117" stroke="#00ff41" stroke-width="0.8"/>
      <text x="212" y="106" text-anchor="middle">🚀 Backstage Deploy UI</text>
    </g>
  </g>
</svg>
